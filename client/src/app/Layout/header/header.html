<header aria-label="Navigation Bar" id="header"
        class="min-h-16 md:mx-10 lg:mx-24 drop-shadow-lg bg-green-800 rounded">
  <!-- PC MENU -->
  <nav class="hidden md:flex flex-row justify-between md:px-10 pt-2">
    <a class="font-bold text-2xl text-green-100">Carnivorous Cultivars</a>
    <div class="inline-flex gap-4 text-xl">
      <a routerLink="" routerLinkActive="active" class="menu-item ease-in-out">
        Home
      </a>
      <a routerLink="/about" routerLinkActive="active" class="menu-item">
        About
      </a>
      <a routerLink="/account" routerLinkActive="active" class="menu-item">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3" aria-label="account" aria-description="account">
          <path d="M200-246q54-53 125.5-83.5T480-360q83 0 154.5 30.5T760-246v-514H200v514Zm280-194q58 0 99-41t41-99q0-58-41-99t-99-41q-58 0-99 41t-41 99q0 58 41 99t99 41ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm69-80h422q-44-39-99.5-59.5T480-280q-56 0-112.5 20.5T269-200Zm211-320q-25 0-42.5-17.5T420-580q0-25 17.5-42.5T480-640q25 0 42.5 17.5T540-580q0 25-17.5 42.5T480-520Zm0 17Z"/>
        </svg>
      </a>
    </div>
  </nav>


  <!-- MOBILE MENU  -->
  <nav class="md:hidden flex justify-between w-full pt-4 px-2 text-lg">
    <a class="font-bold text-xl text-green-100">Carnivorous Cultivars</a>
    <div id="side-menu">
      <button (click)="toggleMenu()" >
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
        </svg>
      </button>

      <p-drawer header=" " [(visible)]="isMenuOpen" position="right">
        <div class="flex flex-col gap-4">
          <a routerLink="" routerLinkActive="active">Home</a>
          <a routerLink="/about" routerLinkActive="active">About</a>
          <a>Search?</a>
        </div>
        <ng-template #footer>
          <div class="flex items-center justify-center">
            <button pButton class="w-1/2">
              <a routerLink="/account" routerLinkActive="active" aria-description="account" aria-label="description">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                  <path d="M200-246q54-53 125.5-83.5T480-360q83 0 154.5 30.5T760-246v-514H200v514Zm280-194q58 0 99-41t41-99q0-58-41-99t-99-41q-58 0-99 41t-41 99q0 58 41 99t99 41ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm69-80h422q-44-39-99.5-59.5T480-280q-56 0-112.5 20.5T269-200Zm211-320q-25 0-42.5-17.5T420-580q0-25 17.5-42.5T480-640q25 0 42.5 17.5T540-580q0 25-17.5 42.5T480-520Zm0 17Z"/>
                </svg>
              </a>
            </button>
          </div>
        </ng-template>
      </p-drawer>
    </div>
  </nav>

  <!-- PLANT TYPES SUBMENU - Always Present -->
  <div id="submenu" class="mt-2" >
    <nav class="flex flex-row justify-center gap-8">
      <a routerLink="/plants/venusflytrap" routerLinkActive="active">Venus Flytraps</a>
      <a routerLink="/plants/pitcher" routerLinkActive="active">Pitchers</a>
      <a routerLink="/plants/sundew" routerLinkActive="active">Sundews</a>
    </nav>
  </div>
</header>
